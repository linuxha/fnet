; fnetd.conf — see docs/fnetd-fsd.md §4.2.2 and docs/fnetd-guide.md
;
; Ports inherit [defaults]. Comments start with ';' or '#'.
; Check this file with:  fnetd -t -c /etc/fnetd/fnetd.conf

[daemon]
user            = fnet
log_sink        = journal        ; journal | syslog | file | stderr
log_file        = /var/log/fnetd/fnetd.log
log_level       = info           ; error | warn | notice | info | debug | trace
stats_file      = /run/fnetd/stats.json
stats_interval  = 10
ctl_socket      = /run/fnetd/ctl

[defaults]
flexnet_root    = /srv/fnet/flex
tape_root       = /srv/fnet/tape
default_cpu     = 6800
xfer_timeout_ms = 2000
sync_loss_count = 3
sync_loss_garbage = 16
sync_interval   = 5
char_delay_us   = 0
line_delay_ms   = 0
load_eol        = crlf           ; crlf | cr | lf | raw
load_missing    = s9             ; s9 | none
load_validate   = warn           ; warn | reject | off
punch_mode      = overwrite      ; overwrite | append | version
punch_timeout   = 30
read_only       = no
legacy_drive    = 0              ; drive used by legacy 'M' (RMOUNT)

[tape.cpu]                       ; optional aliases; any <tape_root>/<tag>/ directory works
6811 = 68HC11

; A local serial port.
[port.swtpc]
type     = tty
device   = /dev/ttyUSB0
baud     = 19200
default_cpu = 6800

; fnetd connects out to a terminal server's RFC-2217 port.
;[port.coco]
;type     = rfc2217
;host     = ts1.lan
;port     = 7001
;baud     = 38400
;default_cpu = 6809
;log_level = debug

; A terminal server connects in to fnetd.
;[port.lab6800]
;type     = listen
;bind     = 192.168.1.10
;port     = 7101
;allow    = 192.168.1.50/32
;on_new   = replace              ; replace | refuse
;telnet   = yes                  ; no = raw TCP
;baud     = 9600
;default_cpu = MIKBUG
;legacy_drive = 1
